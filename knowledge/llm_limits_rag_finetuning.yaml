id: llm_limits_rag_finetuning
version: "1.0.0"
title: Giới hạn của LLM, RAG và Fine-tuning
opening_question: >-
  Mình đang phân vân khi nào thì một bài toán dùng thẳng LLM được, khi nào phải lắp thêm thứ khác.
  Bạn giải thích giúp mình nhé?
completion_message: >-
  Cảm ơn bạn. Giờ mình đã phân biệt được các giới hạn của LLM và khi nào nên dùng tool, RAG
  hay fine-tuning.

# Curated from local course transcript references T03-034..T03-036, T03-119
# and T06-147..T06-150. Trade-offs are kept as the session framed them: choices
# that depend on the situation, not fixed rules.
concepts:
  - id: knowledge_cutoff
    required: true
    priority: 10
    description: >-
      Kiến thức của mô hình dừng lại ở thời điểm dữ liệu huấn luyện kết thúc, nên nó không
      biết những sự kiện xảy ra sau đó.
    probe_question: >-
      Nếu hỏi mô hình về một sự kiện vừa xảy ra tuần trước, nó có trả lời đúng được không, vì sao?
    clarify_question: >-
      Bạn nói mô hình "không biết" thông tin mới; giới hạn đó đến từ đâu vậy?

  - id: private_data_gap
    required: true
    priority: 20
    description: >-
      Tài liệu nội bộ của một tổ chức chưa từng nằm trong dữ liệu huấn luyện, nên mô hình không
      thể trả lời dựa trên đó nếu không được cung cấp tài liệu.
    probe_question: >-
      Muốn chatbot trả lời đúng quy định nội bộ của một công ty cụ thể, khó khăn đầu tiên là gì?
    clarify_question: >-
      Chỗ bạn nói mô hình "chưa có dữ liệu đó", cụ thể là loại dữ liệu nào nó thiếu?

  - id: tool_calling
    required: true
    priority: 30
    description: >-
      Với các tác vụ có đáp án chính xác, mô hình có thể nhận diện ý định, bóc tách tham số và
      gọi một hàm bên ngoài thay vì tự sinh ra kết quả.
    probe_question: >-
      Với những tác vụ cần kết quả chính xác tuyệt đối như tính toán, có cách nào tốt hơn là để mô hình tự trả lời không?
    clarify_question: >-
      Bạn nói mô hình "gọi ra bên ngoài"; nó cần xác định được những gì thì mới gọi đúng?

  - id: rag
    required: true
    priority: 40
    description: >-
      Tài liệu liên quan được truy xuất và đưa vào ngữ cảnh để mô hình trả lời bằng cách suy luận
      trên văn bản được cung cấp, thay vì dựa vào trí nhớ.
    probe_question: >-
      Khi tài liệu nội bộ không nằm trong dữ liệu huấn luyện, làm sao để mô hình vẫn trả lời dựa trên tài liệu đó?
    clarify_question: >-
      Bạn nói "đưa tài liệu vào cho mô hình"; đưa vào lúc nào và mô hình dùng nó ra sao?

  - id: finetuning_tradeoff
    required: true
    priority: 50
    description: >-
      Fine-tuning lái mô hình theo dữ liệu cụ thể nhưng đòi hỏi công sức xử lý dữ liệu và thường
      đánh đổi khả năng tổng quát, nên là một lựa chọn đánh đổi chứ không mặc định.
    probe_question: >-
      Fine-tuning nghe có vẻ mạnh hơn; vậy tại sao không phải lúc nào cũng nên chọn nó?
    clarify_question: >-
      Bạn nói fine-tuning "tốn công"; ngoài công sức thì mô hình còn đánh đổi điều gì nữa không?

misconceptions:
  - id: M01
    concept_id: finetuning_tradeoff
    priority: 10
    incorrect_claim: >-
      Fine-tuning luôn là lựa chọn tốt nhất vì nó làm mô hình thông minh hơn về mọi mặt.
    correction: >-
      Fine-tuning chuyên biệt hoá mô hình và thường làm giảm năng lực tổng quát, nên phù hợp với
      lĩnh vực hẹp chứ không phải mọi tình huống.
    challenge_question: >-
      Nếu fine-tune luôn làm mô hình giỏi hơn, thì sau khi tune sâu vào một lĩnh vực hẹp, khả năng làm
      các tác vụ chung của nó sẽ thay đổi thế nào?

  - id: M02
    concept_id: rag
    priority: 20
    incorrect_claim: >-
      RAG dạy tài liệu vào mô hình một cách vĩnh viễn, giống như quá trình huấn luyện.
    correction: >-
      RAG cung cấp tài liệu ngay lúc trả lời thông qua ngữ cảnh; trọng số của mô hình không đổi.
    challenge_question: >-
      Nếu RAG thực sự dạy luôn tài liệu vào mô hình, thì khi bỏ hệ thống truy xuất đi mô hình vẫn trả lời
      đúng tài liệu nội bộ chứ?

  - id: M03
    concept_id: tool_calling
    priority: 30
    incorrect_claim: >-
      Một LLM đủ mạnh thì không bao giờ cần công cụ bên ngoài vì nó tự tính được mọi thứ.
    correction: >-
      Giao các tác vụ cần chính xác cho một hàm sẽ cho kết quả đáng tin cậy mà việc tự sinh văn bản
      không đảm bảo được.
    challenge_question: >-
      Với một phép tính cần đúng tuyệt đối, kết quả do mô hình tự sinh ra và kết quả do một hàm tính toán
      trả về khác nhau ở điểm nào về mặt đảm bảo?

  - id: M04
    concept_id: knowledge_cutoff
    priority: 40
    incorrect_claim: >-
      LLM tự động cập nhật kiến thức của nó khi có sự kiện mới xảy ra.
    correction: >-
      Kiến thức của mô hình được cố định lúc huấn luyện; thông tin mới phải được đưa vào từ bên
      ngoài, ví dụ bằng tìm kiếm hoặc truy xuất.
    challenge_question: >-
      Nếu mô hình tự cập nhật kiến thức theo thời gian, thì vì sao người ta vẫn phải lắp thêm công cụ tìm kiếm
      cho nó khi cần thông tin mới?
