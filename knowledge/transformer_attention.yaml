id: transformer_attention
version: "1.0.0"
title: Transformer và cơ chế Self-Attention
opening_question: >-
  Mình nghe nói Transformer là kiến trúc nền của các LLM hiện nay, nhưng chưa hình dung
  được nó xử lý một câu như thế nào. Bạn giảng lại cho mình nhé?
completion_message: >-
  Cảm ơn bạn. Giờ mình đã hiểu Transformer biểu diễn và liên kết các token ra sao, cũng như
  vì sao cơ chế nhìn song song lại quan trọng.

# Curated from local course transcript references T06-126..T06-133.
# Definitions stay at the conceptual level taught in the session and avoid
# implementation details the transcript does not establish.
concepts:
  - id: embedding
    required: true
    priority: 10
    description: >-
      Mỗi token được chuyển thành một vectơ để có vị trí trong không gian toán học và
      có thể tính toán được.
    probe_question: >-
      Sau khi văn bản được tách thành token, mô hình phải làm gì với các token đó để tính toán được?
    clarify_question: >-
      Bạn nói mô hình "biểu diễn" token; vậy nó chuyển token thành dạng gì để tính toán được?

  - id: self_attention
    required: true
    priority: 20
    description: >-
      Mỗi token nhìn sang các token khác và chấm điểm mức độ liên quan, nhờ đó mô hình
      xác định được một từ đang chỉ tới token nào.
    probe_question: >-
      Khi trong câu có một đại từ như "nó", mô hình dựa vào cơ chế nào để biết "nó" chỉ cái gì?
    clarify_question: >-
      Chỗ bạn nói các token "liên hệ với nhau", cụ thể mỗi token làm gì với những token còn lại?

  - id: query_key_value
    required: true
    priority: 30
    description: >-
      Attention so sánh query với key của các token khác để quyết định lấy bao nhiêu phần
      value của mỗi token.
    probe_question: >-
      Trong cơ chế attention có ba thành phần Q, K, V; vai trò của từng cái là gì vậy bạn?
    clarify_question: >-
      Bạn có thể nói rõ query, key và value khác nhau ở chỗ nào không?

  - id: parallel_processing
    required: true
    priority: 40
    description: >-
      Khác với các kiến trúc tuần tự, Transformer cho phép mọi token nhìn lẫn nhau cùng lúc
      thay vì truyền thông tin qua từng bước.
    probe_question: >-
      Transformer xử lý các token trong câu theo thứ tự lần lượt hay cùng lúc, và điều đó có lợi gì?
    clarify_question: >-
      Ý bạn nói mô hình xử lý "nhanh hơn" là do cách nó duyệt qua các token khác thế nào?

  - id: similarity_score
    required: true
    priority: 50
    description: >-
      Phép so sánh tạo ra điểm số thể hiện mức độ liên quan giữa hai token, và điểm cao nhất
      quyết định token nào được chọn làm tham chiếu.
    probe_question: >-
      Sau khi các token nhìn nhau, mô hình dựa vào đâu để chọn ra token liên quan nhất?
    clarify_question: >-
      Bạn nói mô hình "chọn được" token đúng; nó so sánh dựa trên cái gì để chọn?

misconceptions:
  - id: M01
    concept_id: self_attention
    priority: 10
    incorrect_claim: >-
      Self-attention nghĩa là mô hình đọc câu lần lượt từng từ từ trái sang phải và nhớ từ
      phía trước.
    correction: >-
      Mọi token nhìn tất cả các token khác cùng một lúc; đọc tuần tự là cách các kiến trúc cũ
      như RNN hay LSTM hoạt động.
    challenge_question: >-
      Nếu mô hình chỉ đọc lần lượt từng từ và nhớ từ phía trước, thì với một văn bản rất dài nó sẽ gặp
      vấn đề gì mà Transformer lại tránh được?

  - id: M02
    concept_id: embedding
    priority: 20
    incorrect_claim: >-
      Embedding lưu nghĩa từ điển của một từ dưới dạng chữ bên trong mô hình.
    correction: >-
      Embedding đặt token thành một vectơ trong không gian toán học để tính toán được, chứ
      không lưu một định nghĩa bằng chữ.
    challenge_question: >-
      Nếu mô hình lưu thẳng nghĩa của từ dưới dạng chữ, thì nó thực hiện các phép tính trên nghĩa đó
      bằng cách nào?

  - id: M03
    concept_id: parallel_processing
    priority: 30
    incorrect_claim: >-
      Transformer nhanh hơn chỉ vì nó chạy trên phần cứng mạnh hơn.
    correction: >-
      Tốc độ đến từ chính kiến trúc cho phép xử lý các token song song, không chỉ do phần cứng
      nhanh hơn.
    challenge_question: >-
      Nếu chỉ do phần cứng mạnh hơn, thì chạy kiến trúc tuần tự cũ trên đúng phần cứng đó có cho kết quả
      tương đương không, và vì sao?
