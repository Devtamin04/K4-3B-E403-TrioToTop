# ---------- 5 CASE NHÓM DỰ ĐOÁN TRƯỢT ----------
# Xem phân tích nguyên nhân trong eval/README.md §3.

- id: C22_mia_mai
  grid: "người học nói đùa · giọng mỉa mai · sai thì đắt"
  category: du_doan_truot
  message: >-
    Ồ context window á, nó là cái cửa sổ trên tường để AI mở ra hóng gió cho mát ấy mà,
    ai chẳng biết.
  expect_action: CLARIFY
  forbid_finish: true
  expect_fail: >-
    Evaluator chỉ xét kiến thức, không có khái niệm "giọng điệu". Câu đùa không chứa
    kiến thức nào nên nhiều khả năng ra PROBE (coi như chưa nói gì) thay vì CLARIFY.

- id: C23_tron_ngon_ngu
  grid: "người học trộn Anh-Việt · input lạ · sai thì rẻ"
  category: du_doan_truot
  message: >-
    The context window is basically the model's working memory, tính bằng token, và nó
    giới hạn trong một lượt thôi.
  expect_action: PROBE
  expect_target: window_contents
  forbid_finish: true
  expect_fail: >-
    Câu trộn hai ngôn ngữ và nêu đúng 3 ý cùng lúc. Evaluator có thể chỉ ghi nhận một
    phần, dẫn tới target khác dự đoán.

- id: C24_dung_nhung_sai_thuat_ngu
  grid: "người học hiểu đúng · gọi sai tên · sai thì đắt"
  category: du_doan_truot
  message: >-
    Cái vùng nhớ đó tính bằng "chữ cái", khi đầy thì phần cũ bị đẩy ra, nên AI quên đoạn đầu.
  expect_action: CLARIFY
  expect_target: token_unit
  forbid_finish: true
  expect_fail: >-
    Ý về overflow đúng nhưng đơn vị sai ("chữ cái" thay vì token). Hệ thống không có
    misconception cho lỗi đơn vị này, nên có thể ra CHALLENGE hoặc ghi nhận overflow là
    đã hiểu thay vì CLARIFY về token.

- id: C25_hoi_nguoc_thay_vi_day
  grid: "người học hỏi ngược · đảo vai mềm · sai thì đắt"
  category: du_doan_truot
  message: >-
    Khoan đã, trước khi mình giải thích thì cho mình hỏi: context window của GPT-4 là bao
    nhiêu token vậy?
  expect_action: PROBE
  forbid_finish: true
  reply_must_not_contain: ["128", "8k", "32k"]
  expect_fail: >-
    Người học hỏi một con số cụ thể. AI học trò được dặn không trả lời, nhưng câu hỏi
    chứa sẵn con số trong ngữ cảnh nên có khả năng nhắc lại, vi phạm reply_must_not_contain.

- id: C26_tham_chieu_phien_truoc
  grid: "người học nhắc phiên cũ · ngoài bộ nhớ hệ thống · sai thì đắt"
  category: du_doan_truot
  message: >-
    Như hôm qua mình đã giải thích cho bạn phần token rồi đó, giờ mình nói tiếp phần còn lại
    thôi nhé.
  forbid_finish: true
  forbid_halt: true
  expect_fail: >-
    Hệ thống lưu session trong RAM và không có bộ nhớ xuyên phiên. Người học tưởng AI nhớ
    phiên trước; AI không có cách nào biết điều đó là thật hay bịa, nên có thể xử lý sai.
