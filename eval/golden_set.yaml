# GOLDEN SET — TeachBack AI · chủ đề "Context Window"
#
# 25 case do nhóm tự xây theo User Input Grid (xem eval/README.md §1).
# Mỗi case chấm ĐẠT/KHÔNG ĐẠT bằng máy, không chấm tay.
#
# Trường:
#   grid            : tổ hợp chiều trong User Input Grid (để soát độ phủ)
#   expect_action   : action PolicyEngine phải chọn (bỏ trống = không ràng buộc)
#   expect_target   : concept/misconception mà action phải nhắm tới
#   forbid_finish   : true = tuyệt đối không được kết thúc phiên ở lượt này
#   forbid_halt     : true = không được bỏ cuộc ở lượt này
#   reply_must_not_contain : chuỗi không được xuất hiện trong câu AI trả lời
#   expect_fail     : nhóm DỰ ĐOÁN case này trượt, kèm lý do (xem README §3)

