# Golden set — chủ đề Context Window.
#
# Viết lại từ bộ test tay của nhóm (tests/test_case.csv) cho khớp hợp đồng thật
# của hệ thống. Mỗi case chấm ĐẠT/KHÔNG ĐẠT bằng máy, không chấm tay.
#
# expect_action : action PolicyEngine phải chọn sau lượt này
# expect_target : concept/misconception mà action phải nhắm vào (bỏ trống nếu không ràng buộc)
# forbid_finish : true = tuyệt đối không được kết thúc phiên ở lượt này
# reply_must_not_contain : từ khoá không được xuất hiện trong câu AI trả lời

- id: T01_dinh_nghia_day_du
  category: thuong
  prior_covered: [token_unit, working_memory, window_contents]
  message: >-
    Khi vượt quá giới hạn thì phần nội dung cũ bị đẩy ra khỏi cửa sổ, nên mô hình không dùng
    được thông tin đó nữa.
  expect_action: FINISH
  note: Lượt cuối bổ sung nốt overflow_behavior nên phiên được phép kết thúc.

- id: T02_bo_nho_lam_viec
