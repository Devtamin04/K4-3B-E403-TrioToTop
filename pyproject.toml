[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "teachback-ai"
version = "0.1.0"
description = "A deterministic Teach-Back AI chatbot skeleton"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1",
    "httpx>=0.28,<1",
    "pydantic>=2.10,<3",
    "PyYAML>=6,<7",
    "uvicorn>=0.34,<1",
]

[project.optional-dependencies]
openai = ["openai>=2,<3"]

[dependency-groups]
dev = [
    "mypy>=1.14,<2",
    "openai>=2,<3",
    "pytest>=8.3,<9",
    "ruff>=0.9,<1",
    "types-PyYAML>=6.0,<7",
]

[tool.hatch.build.targets.wheel]
packages = ["app", "evals"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = "yaml"
ignore_missing_imports = true
